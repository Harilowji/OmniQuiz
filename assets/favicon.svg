<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="favBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="favAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Security Shield Container -->
  <path d="M32 4
           C49 4 57 8 59 20
           C59 38 48 51 32 60
           C16 51 5 38 5 20
           C7 8 15 4 32 4 Z"
        fill="url(#favShield)"
        stroke="#818CF8"
        stroke-width="1.5" />

  <!-- Circular CBT Accent Arc -->
  <path d="M19 43 A17 17 0 1 1 47 38"
        fill="none"
        stroke="rgba(255, 255, 255, 0.28)"
        stroke-width="3.5"
        stroke-linecap="round" />

  <!-- Core Speed Lightning Bolt -->
  <path d="M36 13
           L21 33
           L31 33
           L27 51
           L45 28
           L35 28
           Z"
        fill="url(#favBolt)"
        stroke="#FFFFFF"
        stroke-width="0.8"
        stroke-linejoin="round" />

  <path d="M34 18 L25 31 L32 31 L29 44 L41 30 L35 30 Z"
        fill="url(#favAmber)"
        opacity="0.85" />

  <!-- Accuracy Checkmark Node -->
  <circle cx="48" cy="16" r="6" fill="#0F172A" />
  <circle cx="48" cy="16" r="4.5" fill="#10B981" />
  <path d="M46 16 L47.5 17.5 L50.5 14.5"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.2"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>
