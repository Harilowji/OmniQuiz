<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background & Shield Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="45%" stop-color="#4338CA" />
      <stop offset="85%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.9" />
    </linearGradient>

    <!-- Lightning & Core Gradients -->
    <linearGradient id="lightningGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Ambient Shadow & Glow -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06B6D4" flood-opacity="0.45" />
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Shield (Squircle CBT Security Vault) -->
  <path d="M256 32
           C384 32 446 56 458 152
           C462 284 380 398 256 480
           C132 398 50 284 54 152
           C66 56 128 32 256 32 Z"
        fill="url(#shieldGrad)"
        stroke="url(#shieldBorderGrad)"
        stroke-width="7"
        stroke-linejoin="round"
        filter="url(#coreGlow)" />

  <!-- Inner Glassmorphism Armor Line -->
  <path d="M256 56
           C366 56 420 76 430 158
           C434 268 364 366 256 442
           C148 366 78 268 82 158
           C92 76 146 56 256 56 Z"
        fill="none"
        stroke="rgba(255, 255, 255, 0.16)"
        stroke-width="3"
        stroke-dasharray="12 6" />

  <!-- Circular CBT Gauge & Orbit Track (Pacing & Completion) -->
  <circle cx="256" cy="248" r="126"
          fill="none"
          stroke="rgba(255, 255, 255, 0.08)"
          stroke-width="18" />

  <path d="M167 337
           A126 126 0 1 1 370 310"
        fill="none"
        stroke="url(#shieldBorderGrad)"
        stroke-width="18"
        stroke-linecap="round" />

  <!-- Speed Lightning Bolt (High-Performance CBT Exam Engine) -->
  <path d="M284 104
           L174 264
           L246 264
           L220 404
           L346 232
           L272 232
           Z"
        fill="url(#lightningGrad)"
        stroke="#FFFFFF"
        stroke-width="4"
        stroke-linejoin="miter"
        filter="url(#boltGlow)" />

  <!-- Amber Spark Inlay on Lightning -->
  <path d="M276 136
           L198 252
           L252 252
           L234 356
           L318 244
           L266 244
           Z"
        fill="url(#amberGrad)"
        opacity="0.9" />

  <!-- Precision Check Node (Grade A Certification & 100% Accuracy) -->
  <circle cx="376" cy="132" r="28" fill="#0F172A" stroke="url(#shieldBorderGrad)" stroke-width="4" />
  <circle cx="376" cy="132" r="22" fill="url(#emeraldGrad)" />
  <path d="M366 132 L373 139 L388 124"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Bottom Spark Node (Security Vault Anchor) -->
  <circle cx="256" cy="442" r="7" fill="#38BDF8" opacity="0.85" />
</svg>
