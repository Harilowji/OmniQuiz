<svg width="100%" height="100%" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand Gradient for Main Title (Cyan -> Indigo -> Purple -> Pink) -->
    <linearGradient id="brand-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="28%" stop-color="#6366f1" />
      <stop offset="68%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Flowing Sine Wave Ribbon Gradients -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Sweeping Laser Beam Trail -->
    <linearGradient id="laser-beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Specular Shimmer Beam inside text -->
    <linearGradient id="shimmer-sweep-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Badge Crest Gradient -->
    <linearGradient id="crest-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="title-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur2" />
      <feFlood flood-color="#6366f1" flood-opacity="0.5" result="c1" />
      <feComposite in="c1" in2="blur1" operator="in" result="g1" />
      <feFlood flood-color="#38bdf8" flood-opacity="0.3" result="c2" />
      <feComposite in="c2" in2="blur2" operator="in" result="g2" />
      <feMerge>
        <feMergeNode in="g2" />
        <feMergeNode in="g1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Keyframe Animations -->
    <style>
      /* Breathing Glow for Title */
      @keyframes title-pulse {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.25)); }
        50% { filter: drop-shadow(0 0 22px rgba(99, 102, 241, 0.65)) drop-shadow(0 0 40px rgba(192, 132, 252, 0.45)); }
      }

      /* Shimmer Beam Sweep */
      @keyframes shimmer-flow {
        0% { transform: translateX(-500px) skewX(-25deg); }
        35%, 100% { transform: translateX(1100px) skewX(-25deg); }
      }

      /* Sinuous Wave Motions */
      @keyframes wave-sway-1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes wave-sway-2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }

      /* Laser Runners */
      @keyframes laser-flow-1 {
        0% { stroke-dashoffset: 700; opacity: 0.15; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: -700; opacity: 0.15; }
      }
      @keyframes laser-flow-2 {
        0% { stroke-dashoffset: -700; opacity: 0.15; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 700; opacity: 0.15; }
      }

      /* Mascot Crest Breathing */
      @keyframes crest-float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(-1.5deg); }
      }

      /* Twinkling Nodes */
      @keyframes star-fade {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }

      .title-group {
        animation: title-pulse 4.5s ease-in-out infinite;
      }
      .wave-line-1 {
        transform-origin: 450px 100px;
        animation: wave-sway-1 5s ease-in-out infinite;
      }
      .wave-line-2 {
        transform-origin: 450px 100px;
        animation: wave-sway-2 6s ease-in-out infinite 0.8s;
      }
      .laser-1 {
        stroke-dasharray: 80 320;
        animation: laser-flow-1 4.2s linear infinite;
      }
      .laser-2 {
        stroke-dasharray: 90 350;
        animation: laser-flow-2 4.8s linear infinite 0.5s;
      }
      .shimmer-rect {
        animation: shimmer-flow 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .crest-anim {
        transform-origin: 145px 95px;
        animation: crest-float 5s ease-in-out infinite;
      }
      .star-1 { transform-box: fill-box; transform-origin: center; animation: star-fade 3s ease-in-out infinite; }
      .star-2 { transform-box: fill-box; transform-origin: center; animation: star-fade 2.4s ease-in-out infinite 1.2s; }
      .star-3 { transform-box: fill-box; transform-origin: center; animation: star-fade 3.6s ease-in-out infinite 0.6s; }
    </style>
  </defs>

  <!-- ================= BACKGROUND SINE WAVE CURVES ================= -->
  <g class="wave-line-1">
    <path d="M 40 105 Q 160 55, 300 95 T 580 95 T 860 70" stroke="url(#wave-grad-1)" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.75" />
    <path class="laser-1" d="M 40 105 Q 160 55, 300 95 T 580 95 T 860 70" stroke="url(#laser-beam-grad)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#soft-glow)" />
  </g>

  <g class="wave-line-2">
    <path d="M 50 85 Q 200 130, 360 85 T 660 115 T 870 90" stroke="url(#wave-grad-2)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path class="laser-2" d="M 50 85 Q 200 130, 360 85 T 660 115 T 870 90" stroke="url(#laser-beam-grad)" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#soft-glow)" />
  </g>

  <!-- ================= TWINKLING DATA NODES ================= -->
  <g class="star-1"><circle cx="210" cy="50" r="2" fill="#38bdf8" filter="url(#soft-glow)" /></g>
  <g class="star-2"><circle cx="430" cy="35" r="2.5" fill="#c084fc" filter="url(#soft-glow)" /></g>
  <g class="star-3"><circle cx="680" cy="45" r="2" fill="#38bdf8" filter="url(#soft-glow)" /></g>
  <g class="star-1"><circle cx="780" cy="130" r="2.2" fill="#ec4899" filter="url(#soft-glow)" /></g>
  <g class="star-2"><circle cx="270" cy="140" r="1.8" fill="#10b981" filter="url(#soft-glow)" /></g>

  <!-- ================= MASCOT OWL CREST ICON (LEFT) ================= -->
  <g class="crest-anim">
    <!-- Outer Hex Shield Aura -->
    <path d="M 145 52 L 180 72 L 180 118 L 145 138 L 110 118 L 110 72 Z" fill="#0f172a" stroke="url(#crest-grad)" stroke-width="2.5" filter="url(#soft-glow)" />
    <!-- Graduation Cap / Diamond Motif -->
    <path d="M 145 64 L 168 76 L 145 88 L 122 76 Z" fill="url(#crest-grad)" />
    <path d="M 168 76 L 168 88" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Cyber Owl Eyes (Two Glowing Cyan Hexagons) -->
    <circle cx="135" cy="98" r="5" fill="#38bdf8" filter="url(#soft-glow)" />
    <circle cx="135" cy="98" r="2" fill="#ffffff" />
    <circle cx="155" cy="98" r="5" fill="#38bdf8" filter="url(#soft-glow)" />
    <circle cx="155" cy="98" r="2" fill="#ffffff" />
    <!-- Beak & Infinity Loop Accent -->
    <path d="M 145 102 L 149 110 L 141 110 Z" fill="#f59e0b" />
    <path d="M 130 118 Q 138 123, 145 118 T 160 118" stroke="#c084fc" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- ================= MAIN TYPOGRAPHY ================= -->
  <g class="title-group" filter="url(#title-glow)">
    <!-- Main Title: OmniQuiz -->
    <text x="215" y="112"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Inter, sans-serif"
          font-weight="900"
          font-size="62"
          letter-spacing="1px"
          fill="url(#brand-text-grad)">OmniQuiz</text>

    <!-- PRO Pill Badge -->
    <g transform="translate(545, 68)">
      <rect x="0" y="0" width="85" height="42" rx="10" fill="url(#brand-text-grad)" filter="url(#soft-glow)" />
      <text x="42.5" y="29"
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-weight="900"
            font-size="22"
            letter-spacing="2px"
            text-anchor="middle"
            fill="#ffffff">PRO</text>
    </g>

    <!-- Subtitle: UNIVERSAL CBT EXAM PLATFORM -->
    <text x="218" y="145"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, monospace"
          font-weight="700"
          font-size="14.5"
          letter-spacing="6px"
          fill="#94a3b8">UNIVERSAL CBT EXAM PLATFORM</text>
  </g>

  <!-- Shimmer Beam Overlay across Text Area -->
  <g clip-path="url(#title-clip)">
    <rect class="shimmer-rect" x="200" y="45" width="220" height="110" fill="url(#shimmer-sweep-grad)" opacity="0.45" />
  </g>

  <!-- Subtle Bottom Accent Pill Under Subtitle -->
  <rect x="218" y="158" width="160" height="3" rx="1.5" fill="url(#brand-text-grad)" />
  <circle cx="395" cy="159.5" r="2" fill="#38bdf8" />
  <circle cx="410" cy="159.5" r="2" fill="#c084fc" />
</svg>
