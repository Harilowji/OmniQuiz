<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Technology Gradient (Deep Indigo to Cyber Cyan) -->
    <linearGradient id="omniShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="40%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="omniBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Ambient Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Security Shield Base -->
  <path d="M256 44
           C380 44 440 68 450 164
           C454 294 376 402 256 468
           C136 402 58 294 62 164
           C72 68 132 44 256 44 Z"
        fill="url(#omniShield)"
        stroke="url(#omniBorder)"
        stroke-width="6"
        stroke-linejoin="round"
        filter="url(#softGlow)" />

  <!-- Inner Glassmorphism Contour -->
  <path d="M256 64
           C364 64 418 86 426 170
           C430 282 362 376 256 440
           C150 376 82 282 86 170
           C94 86 148 64 256 64 Z"
        fill="none"
        stroke="rgba(255, 255, 255, 0.18)"
        stroke-width="2.5" />

  <!-- Minimalist Core: Fused CBT Checkmark & Lightning Bolt -->
  <path d="M152 260
           L222 330
           L336 136
           L276 242
           L338 242
           L234 402
           L264 296
           L214 296
           Z"
        fill="#FFFFFF"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linejoin="round" />

  <!-- Verification Accent Dot (Accuracy & Grade A CBT) -->
  <circle cx="366" cy="132" r="15" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
</svg>
