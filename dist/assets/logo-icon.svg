<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradient Anime Cyberpunk: Cyan -> Purple -> Neon Magenta -->
    <linearGradient id="cyber-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>

    <!-- Gradient Ngôi sao lấp lánh (Kira-Sparkle) -->
    <linearGradient id="star-sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Bộ lọc phát sáng Cyber Glow -->
    <filter id="cyber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hào quang nền -->
  <circle cx="36" cy="36" r="30" fill="url(#cyber-brand-grad)" opacity="0.15" filter="url(#cyber-glow)" />

  <!-- Vòng Mecha Halo phân đoạn (Vành ngoài trên) -->
  <path d="M36 8C48.5 8 59.2 16.5 62.5 28.5L54 31C51.5 22.5 44.5 16.5 36 16.5c-4.2 0-8.2 1.5-11.3 4L19 14C23.8 10.2 29.6 8 36 8z" 
        fill="url(#cyber-brand-grad)" filter="url(#cyber-glow)" />

  <!-- Vòng Mecha Halo phân đoạn (Vành ngoài dưới) -->
  <path d="M36 64C23.5 64 12.8 55.5 9.5 43.5L18 41c2.5 8.5 9.5 14.5 18 14.5c4.2 0 8.2-1.5 11.3-4L53 58C48.2 61.8 42.4 64 36 64z" 
        fill="url(#cyber-brand-grad)" filter="url(#cyber-glow)" />

  <!-- Điểm neo giao diện Mecha (HUD Dots) -->
  <circle cx="12" cy="24" r="2" fill="#00F0FF" />
  <circle cx="60" cy="48" r="2" fill="#FF2A85" />

  <!-- Vòng ngắm điện tử (Target Reticle) -->
  <circle cx="36" cy="36" r="16" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7" />

  <!-- Ngôi sao 4 cánh Anime (Kira-Kira Star / Critical Sparkle) -->
  <path d="M36 14 C36 27 28 36 14 36 C28 36 36 45 36 58 C36 45 44 36 58 36 C44 36 36 27 36 14 Z" 
        fill="url(#star-sparkle-grad)" />

  <!-- Tâm điểm ánh sáng trắng -->
  <circle cx="36" cy="36" r="2.4" fill="#FFFFFF" />
</svg>
