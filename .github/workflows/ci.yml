name: OmniQuiz PRO Enterprise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Verify TypeScript, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Run Backend RESTful API Test Suite
        run: node tests/api.test.js

      - name: Run Vitest Unit & Integration Tests
        run: npx vitest run

      - name: Production Bundle Build (Vite & PWA)
        run: npm run build
